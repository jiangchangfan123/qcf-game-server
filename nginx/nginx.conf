# QCF Game Server - Nginx 负载均衡配置
# 用法: nginx -c /path/to/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ========== 后端服务定义 ==========
    
    # TCP 游戏服务器（无状态，轮询）
    upstream game_tcp {
        server 127.0.0.1:8080;
        # server 127.0.0.1:8081;  # 第二个实例
    }

    # WebSocket 服务器（需要会话粘滞）
    upstream game_ws {
        ip_hash;
        server 127.0.0.1:8081;
        # server 127.0.0.1:8083;  # 第二个实例
    }

    # HTTP API 服务器
    upstream game_http {
        server 127.0.0.1:8082;
        # server 127.0.0.1:8084;  # 第二个实例
    }

    # ========== 服务器配置 ==========
    
    server {
        listen 80;
        server_name localhost;

        # WebSocket 代理
        location /ws {
            proxy_pass http://game_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API 代理
        location /api/ {
            proxy_pass http://game_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 静态文件（游戏页面）
        location / {
            proxy_pass http://game_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
