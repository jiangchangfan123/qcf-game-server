<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国王与奴隶 - 暗黒カジノ</title>
<style>
/* ========== 基础重置 ========== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Microsoft YaHei','Segoe UI',sans-serif;
  background:#0a0a0a;
  color:#e0d5c1;
  min-height:100vh;
}

/* ========== 背景纹理 ========== */
body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(139,0,0,0.03) 2px,
      rgba(139,0,0,0.03) 4px
    );
  pointer-events:none;
  z-index:0;
}

/* ========== 暗红光晕 ========== */
body::after{
  content:'';
  position:fixed;
  top:50%;left:50%;
  width:120vmax;height:120vmax;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center, rgba(139,0,0,0.08) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ========== 顶栏 ========== */
.topbar{
  position:relative;
  z-index:10;
  background:linear-gradient(180deg, #1a0a0a 0%, #0d0505 100%);
  border-bottom:1px solid #3a1a1a;
  padding:10px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.topbar h1{
  font-size:18px;
  font-weight:900;
  letter-spacing:4px;
  background:linear-gradient(135deg, #c9a44a, #f0d68a, #c9a44a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(201,164,74,0.3);
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.topbar .info{
  font-size:11px;
  color:#665544;
}
.topbar button{
  background:rgba(201,164,74,0.1);
  color:#c9a44a;
  border:1px solid rgba(201,164,74,0.3);
  padding:5px 12px;
  border-radius:4px;
  cursor:pointer;
  font-size:11px;
  transition:all 0.2s;
}
.topbar button:hover{
  background:rgba(201,164,74,0.2);
  border-color:#c9a44a;
}

/* ========== 用户菜单 ========== */
.user-menu{position:relative}
.user-dropdown{
  position:absolute;
  right:0;top:100%;
  margin-top:4px;
  background:#1a0f0f;
  border:1px solid #3a1a1a;
  border-radius:6px;
  overflow:hidden;
  z-index:100;
  min-width:140px;
  box-shadow:0 8px 24px rgba(0,0,0,0.6);
}
.user-dropdown div{
  padding:10px 16px;
  cursor:pointer;
  font-size:12px;
  transition:background 0.15s;
}
.user-dropdown div:hover{background:#2a1515}
.user-dropdown .logout{color:#8b2020}
.user-dropdown .profile{color:#665544;border-top:1px solid #2a1515}

/* ========== 屏幕切换 ========== */
.screen{
  display:none;
  position:relative;
  z-index:1;
  height:calc(100vh - 44px);
  overflow-y:auto;
}
.screen.active{display:flex;flex-direction:column}

/* ========== 登录屏 ========== */
#screen-login{
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(139,0,0,0.15) 0%, transparent 60%),
    #0a0a0a;
}
.login-card{
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
  border:1px solid #2a1515;
  border-radius:12px;
  padding:40px 32px;
  width:340px;
  max-width:90vw;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.login-card h2{
  font-size:24px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:8px;
  color:#c9a44a;
}
.login-card .subtitle{
  font-size:11px;
  color:#554433;
  margin-bottom:28px;
  letter-spacing:2px;
}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{
  display:block;
  font-size:11px;
  color:#665544;
  margin-bottom:4px;
  letter-spacing:1px;
}
.form-group input{
  width:100%;
  padding:10px 12px;
  background:#0d0808;
  border:1px solid #2a1515;
  border-radius:6px;
  color:#e0d5c1;
  font-size:14px;
  outline:none;
  transition:border-color 0.2s;
}
.form-group input:focus{border-color:#8b2020}
.form-group input::placeholder{color:#332222}

/* ========== 按钮 ========== */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
  transition:all 0.2s;
  letter-spacing:2px;
}
.btn-gold{
  background:linear-gradient(135deg, #c9a44a, #e0c068);
  color:#1a0a0a;
}
.btn-gold:hover{
  background:linear-gradient(135deg, #e0c068, #f0d68a);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(201,164,74,0.3);
}
.btn-outline{
  background:transparent;
  color:#c9a44a;
  border:1px solid rgba(201,164,74,0.3);
}
.btn-outline:hover{
  background:rgba(201,164,74,0.1);
  border-color:#c9a44a;
}
.btn-red{
  background:linear-gradient(135deg, #8b2020, #a03030);
  color:#e0d5c1;
}
.btn-red:hover{
  background:linear-gradient(135deg, #a03030, #b84040);
}
.btn-sm{
  padding:8px 16px;
  font-size:12px;
  width:auto;
}
.btn:disabled{
  opacity:0.4;
  cursor:not-allowed;
  transform:none!important;
}

/* ========== 大厅屏 ========== */
#screen-lobby{
  padding:16px;
  gap:12px;
}
.lobby-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat-card{
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
  border:1px solid #2a1515;
  border-radius:8px;
  padding:14px;
  text-align:center;
}
.stat-card .num{
  font-size:28px;
  font-weight:900;
  color:#c9a44a;
  text-shadow:0 0 10px rgba(201,164,74,0.3);
}
.stat-card .label{
  font-size:10px;
  color:#554433;
  margin-top:4px;
  letter-spacing:1px;
}
.section-card{
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
  border:1px solid #2a1515;
  border-radius:8px;
  padding:16px;
}
.section-card h2{
  font-size:14px;
  font-weight:700;
  color:#c9a44a;
  margin-bottom:12px;
  letter-spacing:2px;
}
.section-card p{font-size:12px;color:#554433;margin-bottom:10px}

/* ========== 排行榜 ========== */
.lb-table{width:100%;border-collapse:collapse;font-size:12px}
.lb-table th{
  padding:8px;
  text-align:center;
  color:#665544;
  font-weight:600;
  border-bottom:1px solid #2a1515;
}
.lb-table td{
  padding:8px;
  text-align:center;
  border-bottom:1px solid #1a0f0f;
}
.lb-table tr:hover{background:rgba(201,164,74,0.05)}
.rank-1{color:#f0d68a;font-weight:900}
.rank-2{color:#a0a0a0;font-weight:700}
.rank-3{color:#cd7f32;font-weight:700}

/* ========== 房间等待屏 ========== */
#screen-room{
  justify-content:center;
  align-items:center;
  padding:20px;
}
.room-card{
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
  border:1px solid #2a1515;
  border-radius:12px;
  padding:32px;
  text-align:center;
  width:400px;
  max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.room-code{
  font-size:48px;
  font-weight:900;
  letter-spacing:12px;
  color:#c9a44a;
  text-shadow:0 0 20px rgba(201,164,74,0.4);
  margin:16px 0;
  font-family:'Courier New',monospace;
}
.room-info{text-align:left;padding:10px 0;font-size:13px;color:#887766}
.room-info span{color:#c9a44a}

/* ========== 对战屏 ========== */
#screen-game{
  padding:0;
  display:none;
  flex-direction:column;
  height:calc(100vh - 44px);
  background:
    radial-gradient(ellipse at 50% 50%, rgba(139,0,0,0.06) 0%, transparent 60%),
    #0a0a0a;
}
#screen-game.active{display:flex}

/* 对战顶栏 */
.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 16px;
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid #1a0f0f;
}
.game-top .score{
  font-size:32px;
  font-weight:900;
  color:#c9a44a;
  text-shadow:0 0 15px rgba(201,164,74,0.3);
}
.game-top .score .vs{color:#554433;font-size:18px;margin:0 8px}
.game-top .round{
  font-size:11px;
  color:#554433;
  letter-spacing:1px;
}
.game-top .opponent-name{
  font-size:12px;
  color:#887766;
}

/* 对手手牌区 */
.op-hand{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:12px 0;
  min-height:70px;
}
.card-back{
  width:44px;
  height:62px;
  background:
    linear-gradient(135deg, #2a1515 0%, #1a0a0a 50%, #2a1515 100%);
  border:1px solid #3a1a1a;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  position:relative;
  overflow:hidden;
}
.card-back::before{
  content:'';
  position:absolute;
  top:4px;left:4px;right:4px;bottom:4px;
  border:1px solid rgba(201,164,74,0.1);
  border-radius:3px;
}
.card-back::after{
  content:'?';
  color:rgba(201,164,74,0.2);
  font-size:18px;
  font-weight:900;
}

/* 中央战场 */
.battlefield{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:24px;
  position:relative;
}
.played-slot{
  width:80px;
  height:112px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:32px;
  transition:all 0.3s;
  position:relative;
}
.played-slot.empty{
  border:2px dashed #2a1515;
  background:transparent;
}
.played-slot.face-down{
  background:linear-gradient(135deg, #2a1515 0%, #1a0a0a 100%);
  border:1px solid #3a1a1a;
  animation:cardPlace 0.3s ease-out;
}
.played-slot.face-down::before{
  content:'';
  position:absolute;
  top:4px;left:4px;right:4px;bottom:4px;
  border:1px solid rgba(201,164,74,0.1);
  border-radius:4px;
}
.played-slot.face-up{
  border:2px solid #c9a44a;
  background:#1a0f0f;
  animation:cardReveal 0.4s ease-out;
}
.played-slot.face-up.win{
  border-color:#c9a44a;
  box-shadow:0 0 20px rgba(201,164,74,0.4);
  animation:cardWin 0.5s ease-out;
}
.played-slot.face-up.lose{
  border-color:#8b2020;
  box-shadow:0 0 20px rgba(139,0,0,0.4);
  animation:cardLose 0.5s ease-out;
}
.played-slot.face-up.draw{
  border-color:#665544;
  box-shadow:0 0 15px rgba(102,85,68,0.3);
}
.played-slot .card-icon{font-size:36px;margin-bottom:4px}
.played-slot .card-name{font-size:11px;color:#887766;letter-spacing:1px}
.vs-text{
  font-size:24px;
  font-weight:900;
  color:#3a1a1a;
  text-shadow:0 0 10px rgba(139,0,0,0.3);
}

/* 回合结果 */
.round-result{
  text-align:center;
  padding:8px;
  font-size:14px;
  font-weight:700;
  letter-spacing:2px;
  min-height:32px;
}
.round-result.win{color:#c9a44a;text-shadow:0 0 10px rgba(201,164,74,0.5)}
.round-result.lose{color:#8b2020;text-shadow:0 0 10px rgba(139,0,0,0.5)}
.round-result.draw{color:#665544}

/* 状态提示 */
.turn-bar{
  text-align:center;
  padding:8px;
  font-size:12px;
  letter-spacing:2px;
  border-top:1px solid #1a0f0f;
  border-bottom:1px solid #1a0f0f;
  background:rgba(0,0,0,0.2);
}
.turn-bar.my-turn{
  color:#c9a44a;
  border-color:rgba(201,164,74,0.2);
  background:rgba(201,164,74,0.05);
}
.turn-bar.waiting{
  color:#554433;
}

/* 手牌区 */
.hand-area{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px 16px;
  flex-wrap:wrap;
}
.hand-card{
  width:72px;
  height:100px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all 0.2s;
  position:relative;
  border:2px solid #2a1515;
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
}
.hand-card:hover:not(:disabled){
  transform:translateY(-6px);
  border-color:#c9a44a;
  box-shadow:0 8px 20px rgba(201,164,74,0.2);
}
.hand-card:active:not(:disabled){
  transform:translateY(-2px);
}
.hand-card:disabled{
  opacity:0.4;
  cursor:not-allowed;
  transform:none!important;
}
.hand-card .card-icon{font-size:28px;margin-bottom:4px}
.hand-card .card-name{font-size:10px;color:#887766;letter-spacing:1px}

/* 牌型颜色 */
.card-commoner .card-icon{filter:grayscale(0.3)}
.card-king .card-icon{text-shadow:0 0 10px rgba(201,164,74,0.5)}
.card-slave .card-icon{filter:brightness(0.8) saturate(1.2)}

/* 底部状态栏 */
.game-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 16px;
  background:rgba(0,0,0,0.3);
  border-top:1px solid #1a0f0f;
  font-size:11px;
  color:#554433;
}

/* AI & 聊天 */
.game-tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:0 16px 8px;
}
.tool-panel{
  background:rgba(0,0,0,0.2);
  border:1px solid #1a0f0f;
  border-radius:6px;
  padding:8px;
}
.tool-panel h3{
  font-size:10px;
  color:#554433;
  margin-bottom:6px;
  letter-spacing:1px;
}
.tool-panel .btn-row{display:flex;gap:4px}
.tool-panel .ai-response{
  font-size:11px;
  color:#887766;
  margin-top:6px;
  line-height:1.5;
  max-height:60px;
  overflow-y:auto;
}
.chat-messages{
  height:60px;
  overflow-y:auto;
  font-size:11px;
  color:#887766;
  margin-bottom:4px;
  padding:4px;
  background:rgba(0,0,0,0.2);
  border-radius:4px;
}
.chat-messages div{margin-bottom:2px}
.chat-messages .me{color:#c9a44a}
.chat-input-row{display:flex;gap:4px}
.chat-input-row input{
  flex:1;
  padding:6px 8px;
  background:#0d0808;
  border:1px solid #2a1515;
  border-radius:4px;
  color:#e0d5c1;
  font-size:11px;
  outline:none;
}
.chat-input-row input:focus{border-color:#8b2020}

/* 对局结束 */
.game-over-overlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50;
  animation:fadeIn 0.3s;
}
.game-over-overlay.show{display:flex}
.game-over-card{
  background:linear-gradient(135deg, #1a0f0f 0%, #0d0808 100%);
  border:1px solid #2a1515;
  border-radius:16px;
  padding:40px;
  text-align:center;
  min-width:300px;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
}
.game-over-card h2{
  font-size:28px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:16px;
}
.game-over-card h2.win{color:#c9a44a;text-shadow:0 0 20px rgba(201,164,74,0.5)}
.game-over-card h2.lose{color:#8b2020;text-shadow:0 0 20px rgba(139,0,0,0.5)}
.game-over-card h2.draw{color:#665544}
.game-over-card .final-score{
  font-size:48px;
  font-weight:900;
  color:#c9a44a;
  margin:16px 0;
}
.game-over-card .final-score .vs{color:#554433;font-size:24px;margin:0 8px}

/* ========== Toast ========== */
.toast{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(26,15,15,0.95);
  border:1px solid #3a1a1a;
  color:#c9a44a;
  padding:10px 20px;
  border-radius:6px;
  font-size:13px;
  z-index:999;
  display:none;
  letter-spacing:1px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.toast.show{display:block;animation:toastIn 0.3s ease-out}

/* ========== 动画 ========== */
@keyframes cardPlace{
  from{transform:scale(0.8) rotateY(90deg);opacity:0}
  to{transform:scale(1) rotateY(0);opacity:1}
}
@keyframes cardReveal{
  from{transform:rotateY(180deg) scale(0.8)}
  to{transform:rotateY(0) scale(1)}
}
@keyframes cardWin{
  0%{transform:scale(1)}
  50%{transform:scale(1.1);box-shadow:0 0 30px rgba(201,164,74,0.6)}
  100%{transform:scale(1)}
}
@keyframes cardLose{
  0%{transform:scale(1)}
  30%{transform:scale(0.95)}
  60%{transform:scale(1.02)}
  100%{transform:scale(1)}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(-10px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.5}
}

/* ========== 响应式 ========== */
@media(max-width:480px){
  .topbar h1{font-size:14px;letter-spacing:2px}
  .game-top .score{font-size:24px}
  .played-slot{width:64px;height:90px}
  .played-slot .card-icon{font-size:28px}
  .hand-card{width:60px;height:84px}
  .hand-card .card-icon{font-size:24px}
  .game-tools{grid-template-columns:1fr}
  .room-code{font-size:36px;letter-spacing:8px}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="topbar">
  <h1>国王与奴隶</h1>
  <div class="topbar-right">
    <span class="info" id="statusText">连接中...</span>
    <button onclick="goLobby()" id="btnBackLobby" style="display:none">返回大厅</button>
    <div class="user-menu" id="userMenu" style="display:none">
      <button onclick="toggleUserMenu()">👤 <span id="menuNickname">-</span> ▾</button>
      <div class="user-dropdown" id="userDropdown" style="display:none">
        <div class="logout" onclick="doLogout()">🚪 退出登录</div>
        <div class="profile" onclick="showProfileModal()">✏️ 修改资料</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 登录屏 ===== -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <h2>国王与奴隶</h2>
    <div class="subtitle">王冠之下 众生皆为筹码</div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="输入你的代号">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="输入密钥">
    </div>
    <button class="btn btn-gold" onclick="doLogin()">进入赌局</button>
    <button class="btn btn-outline" onclick="doRegister()" style="margin-top:6px">注册新账号</button>
  </div>
</div>

<!-- ===== 大厅屏 ===== -->
<div id="screen-lobby" class="screen">
  <div class="lobby-stats">
    <div class="stat-card"><div class="num" id="lbOnline">-</div><div class="label">在线玩家</div></div>
    <div class="stat-card"><div class="num" id="lbBattles">-</div><div class="label">对局进行中</div></div>
    <div class="stat-card"><div class="num" id="lbQueue">-</div><div class="label">匹配队列</div></div>
  </div>

  <div class="section-card">
    <h2>⚔️ 随机匹配</h2>
    <p>随机匹配一名在线玩家，一局定胜负</p>
    <button class="btn btn-gold" id="btnMatch" onclick="doMatch()">开始匹配</button>
    <button class="btn btn-red" id="btnCancelMatch" onclick="doCancelMatch()" style="display:none">取消匹配</button>
  </div>

  <div class="section-card">
    <h2>🏠 创建房间</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gold btn-sm" onclick="doCreateRoom()" style="flex:1">创建房间</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input type="text" id="roomCodeInput" placeholder="输入房间码" style="flex:1;padding:8px;background:#0d0808;border:1px solid #2a1515;border-radius:4px;color:#e0d5c1;font-size:13px;outline:none">
      <button class="btn btn-outline btn-sm" onclick="doJoinRoom()">加入</button>
    </div>
  </div>

  <div class="section-card">
    <h2>🏆 排行榜</h2>
    <table class="lb-table">
      <thead><tr><th>#</th><th>玩家</th><th>胜场</th><th>总场</th><th>胜率</th></tr></thead>
      <tbody id="lbBody"><tr><td colspan="5" style="color:#332222">暂无数据</td></tr></tbody>
    </table>
  </div>
</div>

<!-- ===== 房间等待屏 ===== -->
<div id="screen-room" class="screen">
  <div class="room-card">
    <h2 style="color:#c9a44a;letter-spacing:4px;margin-bottom:8px">房间已创建</h2>
    <div style="font-size:11px;color:#554433">分享房间码给对手</div>
    <div class="room-code" id="roomCodeDisplay">------</div>
    <div class="room-info">👑 房主: <span id="roomHost">-</span></div>
    <div class="room-info">⚔️ 挑战者: <span id="roomGuest" style="color:#332222">等待加入...</span></div>
    <button class="btn btn-red btn-sm" onclick="leaveRoom()" style="margin-top:16px;width:auto;padding:8px 24px">离开房间</button>
  </div>
</div>

<!-- ===== 对战屏 ===== -->
<div id="screen-game" class="screen">
  <!-- 顶部：比分 -->
  <div class="game-top">
    <div>
      <div class="opponent-name" id="gameOpponent">对手: -</div>
      <div class="round" id="gameRound">第 1 局 · 第 1 轮</div>
    </div>
    <div class="score">
      <span id="gameMyScore">0</span>
      <span class="vs">VS</span>
      <span id="gameOpScore">0</span>
    </div>
  </div>

  <!-- 对手手牌 -->
  <div class="op-hand" id="opCards"></div>

  <!-- 中央战场 -->
  <div class="battlefield">
    <div class="played-slot empty" id="myPlayedCard"></div>
    <div class="vs-text" id="vsText" style="display:none">VS</div>
    <div class="played-slot empty" id="opPlayedCard"></div>
  </div>

  <!-- 回合结果 -->
  <div class="round-result" id="roundResult"></div>

  <!-- 状态提示 -->
  <div class="turn-bar waiting" id="turnIndicator">等待对局开始...</div>

  <!-- 手牌区 -->
  <div class="hand-area" id="handCards"></div>

  <!-- AI & 聊天 -->
  <div class="game-tools">
    <div class="tool-panel">
      <h3>🤖 AI 功能</h3>
      <div class="btn-row">
        <button class="btn btn-outline btn-sm" onclick="doAIHint()" id="btnAIHint" style="flex:1">出牌建议</button>
        <button class="btn btn-outline btn-sm" onclick="doAIAnalysis()" id="btnAIAnalysis" style="flex:1">对局复盘</button>
      </div>
      <div class="ai-response" id="aiResponse"></div>
    </div>
    <div class="tool-panel">
      <h3>💬 对局聊天</h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="发消息..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-outline btn-sm" onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 对局结束浮层 ===== -->
<div class="game-over-overlay" id="gameOverOverlay">
  <div class="game-over-card">
    <h2 id="gameOverTitle">对局结束</h2>
    <div class="final-score" id="gameOverScore"></div>
    <button class="btn btn-gold" onclick="goLobby()" style="width:auto;padding:10px 30px;margin-top:16px">返回大厅</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 修改资料弹窗 -->
<div class="game-over-overlay" id="profileModal">
  <div class="game-over-card" style="min-width:280px">
    <h2 style="font-size:18px;letter-spacing:4px;color:#c9a44a;margin-bottom:20px">修改资料</h2>
    <div style="text-align:left;margin-bottom:16px">
      <label style="font-size:11px;color:#665544;display:block;margin-bottom:4px">当前昵称</label>
      <div style="font-size:14px;color:#e0d5c1;padding:8px;background:#0d0808;border-radius:4px" id="profileCurrentNick">-</div>
    </div>
    <div style="text-align:left;margin-bottom:20px">
      <label style="font-size:11px;color:#665544;display:block;margin-bottom:4px">新昵称</label>
      <input type="text" id="profileNicknameInput" placeholder="输入新昵称" style="width:100%;padding:8px;background:#0d0808;border:1px solid #2a1515;border-radius:4px;color:#e0d5c1;font-size:13px;outline:none">
    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-outline btn-sm" onclick="hideProfileModal()" style="width:80px">取消</button>
      <button class="btn btn-gold btn-sm" onclick="updateNickname()" style="width:80px">确认</button>
    </div>
  </div>
</div>

<script src="/js/protobuf.min.js"></script>
<script src="/js/proto.js"></script>
<script src="/js/ws.js"></script>
<script>
// ========== 全局状态 ==========
const state = {
    token: localStorage.getItem('token') || '',
    uid: parseInt(localStorage.getItem('uid') || '0'),
    nickname: localStorage.getItem('nickname') || '',
    battleId: 0,
    hand: [],
    myScore: 0,
    opScore: 0,
    round: 1,
    subRound: 1,
    myTurn: false,
    matching: false,
    roomCode: '',
    pendingCard: null,
};

// ========== Proto & WS 状态 ==========
let protoReady = false;
let protoPromise = null;

// ========== 工具函数 ==========
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('btnBackLobby').style.display =
        (id === 'screen-game' || id === 'screen-room') ? 'inline-block' : 'none';
}

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
}

// ========== 消息ID ==========
const MsgID = {
    Heartbeat: 1, Login: 2, Chat: 3, JoinRoom: 4, LeaveRoom: 5,
    SysNotify: 6, Register: 7, Auth: 8, Match: 9, MatchCancel: 10,
    BattleCreateRoom: 11, BattleJoinRoom: 12, BattleStart: 13,
    PlayCard: 14, RoundResult: 15, BattleEnd: 16,
    Leaderboard: 17, BattleRecords: 18, BattleState: 19,
    AIHint: 20, AIAnalysis: 21, OpponentPlayed: 22,
};

const CARD_ICONS = {0:'🛡️', 1:'👑', 2:'⛓️'};
const CARD_NAMES = {0:'平民', 1:'国王', 2:'奴隶'};
const CARD_CLASSES = {0:'card-commoner', 1:'card-king', 2:'card-slave'};

// ========== 登录/注册 ==========
function doRegister() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (!user || !pass) { toast('请输入用户名和密码'); return; }
    fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user, password: pass})
    }).then(r => r.json()).then(data => {
        toast(data.msg);
        if (data.code === 0) doLogin();
    }).catch(() => toast('网络错误'));
}

function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (!user || !pass) { toast('请输入用户名和密码'); return; }
    fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user, password: pass})
    }).then(r => r.json()).then(data => {
        toast(data.msg);
        if (data.code === 0) {
            state.token = data.token;
            state.uid = data.uid;
            state.nickname = data.nickname || '';
            localStorage.setItem('token', state.token);
            localStorage.setItem('uid', state.uid);
            localStorage.setItem('nickname', state.nickname);
            connectAndEnter();
        }
    }).catch(() => toast('网络错误'));
}

async function connectAndEnter() {
    document.getElementById('statusText').textContent = '连接中...';
    if (!protoReady && protoPromise) {
        try { await protoPromise; } catch(e) {}
    }
    if (!protoReady) {
        toast('协议加载失败，请刷新页面');
        return;
    }
    try {
        await WS.connect('ws://localhost:8081/ws');
    } catch(e) {
        toast('连接服务器失败，请稍后重试');
        document.getElementById('statusText').textContent = '连接失败';
        return;
    }
    WS.send(MsgID.Auth, 'pb.AuthRequest', {token: state.token});
}

function doLogout() {
    if (!confirm('确定退出登录？')) return;
    fetch('/api/logout', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + state.token,
        },
    }).catch(() => {});
    state.token = ''; state.uid = 0; state.nickname = '';
    localStorage.removeItem('token');
    localStorage.removeItem('uid');
    localStorage.removeItem('nickname');
    document.getElementById('userMenu').style.display = 'none';
    document.getElementById('userDropdown').style.display = 'none';
    showScreen('screen-login');
    toast('已退出登录');
}

function toggleUserMenu() {
    const dd = document.getElementById('userDropdown');
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', (e) => {
    const menu = document.getElementById('userMenu');
    const dd = document.getElementById('userDropdown');
    if (menu && dd && !menu.contains(e.target)) dd.style.display = 'none';
});

// ========== 大厅 ==========
function goLobby() {
    state.battleId = 0; state.hand = []; state.myTurn = false;
    state.matching = false; state.pendingCard = null;
    document.getElementById('btnMatch').style.display = 'block';
    document.getElementById('btnCancelMatch').style.display = 'none';
    document.getElementById('gameOverOverlay').classList.remove('show');
    showScreen('screen-lobby');
    loadLeaderboard(); loadStats();
}

function doMatch() { WS.send(MsgID.Match, 'pb.MatchRequest', {}); }
function doCancelMatch() { WS.send(MsgID.MatchCancel, 'pb.MatchCancelRequest', {}); }
function doCreateRoom() { WS.send(MsgID.BattleCreateRoom, 'pb.BattleCreateRoomRequest', {}); }
function leaveRoom() { state.roomCode = ''; goLobby(); }
function doJoinRoom() {
    const code = document.getElementById('roomCodeInput').value.trim();
    if (!code) { toast('请输入房间码'); return; }
    WS.send(MsgID.BattleJoinRoom, 'pb.BattleJoinRoomRequest', {room_code: code});
}

// ========== 对战：渲染 ==========
function renderHand() {
    const container = document.getElementById('handCards');
    container.innerHTML = '';
    state.hand.forEach((card, i) => {
        const btn = document.createElement('button');
        btn.className = 'hand-card ' + (CARD_CLASSES[card] || '');
        btn.disabled = !state.myTurn;
        btn.innerHTML = `<div class="card-icon">${CARD_ICONS[card]||'?'}</div><div class="card-name">${CARD_NAMES[card]||'?'}</div>`;
        btn.onclick = () => playCard(card, i);
        container.appendChild(btn);
    });
}

function renderOpCards() {
    const container = document.getElementById('opCards');
    container.innerHTML = '';
    for (let i = 0; i < state.hand.length; i++) {
        const div = document.createElement('div');
        div.className = 'card-back';
        container.appendChild(div);
    }
}

function showMyCardWaiting() {
    const myEl = document.getElementById('myPlayedCard');
    myEl.className = 'played-slot face-down';
    myEl.innerHTML = '<div class="card-icon">🎴</div>';
    const opEl = document.getElementById('opPlayedCard');
    opEl.className = 'played-slot empty';
    opEl.innerHTML = '';
    document.getElementById('vsText').style.display = 'none';
}

function showOpponentPlayed() {
    const opEl = document.getElementById('opPlayedCard');
    opEl.className = 'played-slot face-down';
    opEl.innerHTML = '<div class="card-icon">🎴</div>';
    document.getElementById('vsText').style.display = 'block';
}

function showPlayedCards(myCard, opCard, result) {
    const myEl = document.getElementById('myPlayedCard');
    const opEl = document.getElementById('opPlayedCard');
    document.getElementById('vsText').style.display = 'block';

    const myClass = result === 1 ? 'win' : result === -1 ? 'lose' : 'draw';
    const opClass = result === -1 ? 'win' : result === 1 ? 'lose' : 'draw';

    myEl.className = 'played-slot face-up ' + myClass;
    myEl.innerHTML = `<div class="card-icon">${CARD_ICONS[myCard]||'?'}</div><div class="card-name">${CARD_NAMES[myCard]||'?'}</div>`;

    opEl.className = 'played-slot face-up ' + opClass;
    opEl.innerHTML = `<div class="card-icon">${CARD_ICONS[opCard]||'?'}</div><div class="card-name">${CARD_NAMES[opCard]||'?'}</div>`;
}

function clearPlayedCards() {
    document.getElementById('myPlayedCard').className = 'played-slot empty';
    document.getElementById('myPlayedCard').innerHTML = '';
    document.getElementById('opPlayedCard').className = 'played-slot empty';
    document.getElementById('opPlayedCard').innerHTML = '';
    document.getElementById('vsText').style.display = 'none';
}

function playCard(cardType, index) {
    if (!state.myTurn) return;
    state.myTurn = false;
    state.pendingCard = {type: cardType, index: index};
    state.hand.splice(index, 1);
    renderHand();
    showMyCardWaiting();
    WS.send(MsgID.PlayCard, 'pb.PlayCardRequest', {
        battle_id: state.battleId, card_type: cardType,
    });
    document.getElementById('turnIndicator').className = 'turn-bar waiting';
    document.getElementById('turnIndicator').textContent = '等待对手出牌...';
}

function updateTurnUI() {
    const el = document.getElementById('turnIndicator');
    if (state.myTurn) {
        el.className = 'turn-bar my-turn';
        el.textContent = '▶ 选择一张牌出战';
    } else {
        el.className = 'turn-bar waiting';
        el.textContent = '等待对手出牌...';
    }
    renderHand();
    renderOpCards();
}

// ========== AI ==========
function doAIHint() {
    if (!state.battleId) return;
    const el = document.getElementById('aiResponse');
    el.textContent = '⏳ AI 思考中...';
    document.getElementById('btnAIHint').disabled = true;
    WS.send(MsgID.AIHint, 'pb.AIHintRequest', {battle_id: state.battleId});
}
function doAIAnalysis() {
    if (!state.battleId) return;
    const el = document.getElementById('aiResponse');
    el.textContent = '⏳ AI 分析中...';
    document.getElementById('btnAIAnalysis').disabled = true;
    WS.send(MsgID.AIAnalysis, 'pb.AIAnalysisRequest', {battle_id: state.battleId});
}

// ========== 聊天 ==========
function sendChat() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !state.battleId) return;
    WS.send(MsgID.Chat, 'pb.ChatMessage', {content: text});
    addChatMsg('我', text, true);
    input.value = '';
}
function addChatMsg(nick, content, isMe) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = isMe ? 'me' : '';
    div.innerHTML = `<b>${nick}:</b> ${content}`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// ========== 排行榜 & 统计 ==========
async function loadLeaderboard() {
    try {
        const res = await fetch('/api/leaderboard?top=10');
        const data = await res.json();
        const tbody = document.getElementById('lbBody');
        if (!data.data || data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="color:#332222">暂无数据</td></tr>';
            return;
        }
        const medals = ['🥇','🥈','🥉'];
        tbody.innerHTML = data.data.map((item, i) => {
            const rc = i < 3 ? ` class="rank-${i+1}"` : '';
            return `<tr><td${rc}>${medals[i]||item.rank}</td><td>${item.nickname||item.uid}</td><td>${item.win}</td><td>${item.total}</td><td>${item.win_rate.toFixed(1)}%</td></tr>`;
        }).join('');
    } catch(e) {}
}
async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        if (data.code === 0) {
            document.getElementById('lbOnline').textContent = data.data.online;
            document.getElementById('lbBattles').textContent = data.data.battles;
            document.getElementById('lbQueue').textContent = data.data.queue;
        }
    } catch(e) {}
}

function updateNickname() {
    const nickname = document.getElementById('profileNicknameInput').value.trim();
    if (!nickname) { toast('请输入昵称'); return; }
    fetch('/api/profile', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + state.token,
        },
        body: JSON.stringify({ nickname: nickname }),
    }).then(r => r.json()).then(data => {
        toast(data.msg);
        if (data.code === 0) {
            state.nickname = data.nickname;
            localStorage.setItem('nickname', state.nickname);
            document.getElementById('menuNickname').textContent = state.nickname;
            hideProfileModal();
        }
    }).catch(() => toast('网络错误'));
}

function showProfileModal() {
    document.getElementById('userDropdown').style.display = 'none';
    document.getElementById('profileCurrentNick').textContent = state.nickname || '-';
    document.getElementById('profileNicknameInput').value = '';
    document.getElementById('profileModal').classList.add('show');
}

function hideProfileModal() {
    document.getElementById('profileModal').classList.remove('show');
}

// ========== 消息处理器 ==========
function setupHandlers() {
    WS.on(MsgID.Heartbeat, () => {});
    WS.on(MsgID.Register, () => {});
    WS.on(MsgID.Login, () => {});

    WS.on(MsgID.Auth, (id, msg) => {
        if (msg.code === 0) {
            state.nickname = msg.nickname || '';
            localStorage.setItem('nickname', state.nickname);
            document.getElementById('userMenu').style.display = 'block';
            document.getElementById('menuNickname').textContent = state.nickname || '玩家';
            var nickEl = document.getElementById('currentNickname');
            if (nickEl) nickEl.textContent = state.nickname || '-';
            toast('进入赌局');
            goLobby();
        } else {
            toast('认证失败: ' + msg.msg);
        }
    });

    WS.on(MsgID.Match, (id, msg) => {
        if (msg.code === 0) {
            state.matching = true;
            document.getElementById('btnMatch').style.display = 'none';
            document.getElementById('btnCancelMatch').style.display = 'block';
            toast('已进入匹配队列');
        } else { toast(msg.msg); }
    });

    WS.on(MsgID.MatchCancel, (id, msg) => {
        state.matching = false;
        document.getElementById('btnMatch').style.display = 'block';
        document.getElementById('btnCancelMatch').style.display = 'none';
        toast(msg.msg);
    });

    WS.on(MsgID.BattleCreateRoom, (id, msg) => {
        if (msg.code === 0) {
            state.roomCode = msg.room_code;
            document.getElementById('roomCodeDisplay').textContent = msg.room_code;
            document.getElementById('roomHost').textContent = state.nickname || '玩家' + state.uid;
            document.getElementById('roomGuest').textContent = '等待加入...';
            document.getElementById('roomGuest').style.color = '#332222';
            showScreen('screen-room');
        } else { toast(msg.msg); }
    });

    WS.on(MsgID.BattleJoinRoom, (id, msg) => {
        if (msg.code !== 0) toast(msg.msg);
    });

    WS.on(MsgID.BattleStart, (id, msg) => {
        state.battleId = Number(msg.battle_id);
        state.round = msg.round || 1;
        state.subRound = 1;
        state.myScore = 0; state.opScore = 0;
        state.matching = false;
        state.pendingCard = null;
        document.getElementById('gameOpponent').textContent = '对手: ' + (msg.nickname || '玩家' + msg.opponent);
        document.getElementById('gameMyScore').textContent = '0';
        document.getElementById('gameOpScore').textContent = '0';
        document.getElementById('gameRound').textContent = '第 1 局 · 第 1 轮';
        document.getElementById('roundResult').textContent = '';
        document.getElementById('roundResult').className = 'round-result';
        document.getElementById('gameOverOverlay').classList.remove('show');
        document.getElementById('btnAIHint').disabled = false;
        document.getElementById('turnIndicator').className = 'turn-bar my-turn';
        document.getElementById('turnIndicator').textContent = '▶ 选择一张牌出战';
        state.myTurn = true;
        state.hand = [0, 0, 0, 1, 2];
        clearPlayedCards();
        renderHand();
        renderOpCards();
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('aiResponse').textContent = '';
        document.getElementById('aiResponse').className = 'ai-response';
        showScreen('screen-game');
        toast('对局开始');
    });

    WS.on(MsgID.BattleState, (id, msg) => {
        state.battleId = Number(msg.battle_id);
        state.round = msg.round; state.subRound = msg.sub_round;
        state.myScore = Number(msg.score1); state.opScore = Number(msg.score2);
        state.hand = (msg.hand || []).map(Number);
        state.myTurn = msg.my_turn;
        document.getElementById('gameOpponent').textContent = '对手: ' + (msg.nickname || '');
        document.getElementById('gameMyScore').textContent = state.myScore;
        document.getElementById('gameOpScore').textContent = state.opScore;
        document.getElementById('gameRound').textContent = `第 ${msg.round} 局 · 第 ${msg.sub_round} 轮`;
        clearPlayedCards(); renderHand(); renderOpCards(); updateTurnUI();
        showScreen('screen-game');
    });

    WS.on(MsgID.PlayCard, (id, msg) => {
        if (msg.code === 3) return; // 等待对方，正常
        if (msg.code !== 0) {
            toast('出牌失败: ' + msg.msg);
            if (state.pendingCard) {
                state.hand.splice(state.pendingCard.index, 0, state.pendingCard.type);
                state.pendingCard = null;
            }
            state.myTurn = true;
            clearPlayedCards(); renderHand(); updateTurnUI();
        }
    });

    WS.on(MsgID.OpponentPlayed, () => { showOpponentPlayed(); });

    WS.on(MsgID.RoundResult, (id, msg) => {
        state.myScore = Number(msg.score1);
        state.opScore = Number(msg.score2);
        state.round = msg.round; state.subRound = msg.sub_round;
        document.getElementById('gameMyScore').textContent = state.myScore;
        document.getElementById('gameOpScore').textContent = state.opScore;
        document.getElementById('gameRound').textContent = `第 ${msg.round} 局 · 第 ${msg.sub_round} 轮`;

        state.pendingCard = null;
        const myCardNum = Number(msg.my_card);
        const opCardNum = Number(msg.op_card);

        showPlayedCards(myCardNum, opCardNum, msg.result);

        const resultEl = document.getElementById('roundResult');
        if (msg.result === 1) {
            resultEl.className = 'round-result win';
            resultEl.textContent = '✦ 你赢了 ✦';
        } else if (msg.result === -1) {
            resultEl.className = 'round-result lose';
            resultEl.textContent = '你输了';
        } else {
            resultEl.className = 'round-result draw';
            resultEl.textContent = '平局';
        }

        if (!msg.game_over) {
            setTimeout(() => {
                if (msg.round_over) state.hand = [0, 0, 0, 1, 2];
                state.myTurn = true;
                document.getElementById('roundResult').textContent = '';
                document.getElementById('roundResult').className = 'round-result';
                clearPlayedCards(); renderHand(); renderOpCards(); updateTurnUI();
                document.getElementById('btnAIHint').disabled = false;
            }, 2000);
        }
    });

    WS.on(MsgID.BattleEnd, (id, msg) => {
        state.myTurn = false;
        document.getElementById('handCards').innerHTML = '';
        document.getElementById('turnIndicator').textContent = '对局结束';

        const overlay = document.getElementById('gameOverOverlay');
        overlay.classList.add('show');

        const title = document.getElementById('gameOverTitle');
        const score = document.getElementById('gameOverScore');
        if (Number(msg.winner) === state.uid) {
            title.textContent = '胜 利';
            title.className = 'win';
        } else if (Number(msg.winner) === 0) {
            title.textContent = '平 局';
            title.className = 'draw';
        } else {
            title.textContent = '败 北';
            title.className = 'lose';
        }
        score.innerHTML = `<span>${msg.score1}</span><span class="vs">VS</span><span>${msg.score2}</span>`;
    });

    WS.on(MsgID.AIHint, (id, msg) => {
        const el = document.getElementById('aiResponse');
        if (msg.code === 0) {
            el.innerHTML = `<b>建议出: ${CARD_NAMES[msg.suggested_card]||'?'}</b> ${msg.reason||''}`;
            // 成功，按钮保持禁用，等下一小局再启用
        } else {
            el.textContent = msg.msg || 'AI 服务不可用';
            document.getElementById('btnAIHint').disabled = false;
        }
    });

    WS.on(MsgID.AIAnalysis, (id, msg) => {
        const el = document.getElementById('aiResponse');
        document.getElementById('btnAIAnalysis').disabled = false;
        if (msg.code === 0) {
            el.innerHTML = `<b>复盘:</b> ${msg.analysis||''}`;
        } else { el.textContent = msg.msg || 'AI 服务不可用'; }
    });

    WS.on(MsgID.Chat, (id, msg) => {
        if (msg && msg.content) addChatMsg(msg.nickname || '对手', msg.content, false);
    });

    WS.on(MsgID.SysNotify, (id, msg) => { toast(msg.content); });
}

// ========== 启动 ==========
async function main() {
    showScreen('screen-login');
    setupHandlers();
    protoPromise = Proto.init().then(() => { protoReady = true; }).catch(e => { console.error('[Proto]', e); });
    if (state.token) connectAndEnter();
    setInterval(() => { if (WS.isConnected()) WS.send(MsgID.Heartbeat, 'pb.Heartbeat', {}); }, 10000);
}
main();
</script>
